version: '3.8'

services:
  bd-server:
    build: ./database
    container_name: postgres_simi
    ports:
      - "5432:5432"
    volumes:
      - ./database_data:/var/lib/postgresql/data
    networks:
      - simi-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d simi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  simi-net:
    driver: bridge
