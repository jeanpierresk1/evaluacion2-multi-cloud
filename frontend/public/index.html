<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Farmacias SIMI | Panel de Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #070d1a;
            --surface: #0d1526;
            --surface-2: #111d33;
            --border: rgba(99, 157, 255, 0.12);
            --border-hover: rgba(99, 157, 255, 0.3);
            --accent: #3d7bff;
            --accent-glow: rgba(61, 123, 255, 0.25);
            --accent-light: #639dff;
            --text-primary: #e8eef8;
            --text-secondary: #7a93b8;
            --text-muted: #3d5070;
            --green: #22d3a0;
            --green-bg: rgba(34, 211, 160, 0.1);
            --yellow: #f0b429;
            --yellow-bg: rgba(240, 180, 41, 0.1);
            --red: #f56565;
            --red-bg: rgba(245, 101, 101, 0.1);
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: var(--font-body);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* === BACKGROUND GRID === */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(61, 123, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61, 123, 255, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* === GLOW ORBS === */
        body::after {
            content: '';
            position: fixed;
            top: -200px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(61, 123, 255, 0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* === NAVBAR === */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(7, 13, 26, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 32px;
            height: 64px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #6faeff);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .nav-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.05em;
            color: var(--text-primary);
        }

        .nav-title span {
            color: var(--accent-light);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-time {
            font-size: 13px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 211, 160, 0.08);
            border: 1px solid rgba(34, 211, 160, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: var(--green);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--green);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.85); }
        }

        /* === MAIN LAYOUT === */
        .main {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        /* === PAGE HEADER === */
        .page-header {
            margin-bottom: 40px;
            animation: fadeUp 0.5s ease both;
        }

        .page-header h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .page-header p {
            margin-top: 6px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* === KPI CARDS === */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease 0.1s both;
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .kpi-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .kpi-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .kpi-icon.blue { background: rgba(61, 123, 255, 0.15); color: var(--accent-light); }
        .kpi-icon.green { background: var(--green-bg); color: var(--green); }
        .kpi-icon.yellow { background: var(--yellow-bg); color: var(--yellow); }

        .kpi-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .kpi-value {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 2px;
        }

        /* === MAIN GRID === */
        .content-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 24px;
            align-items: start;
        }

        /* === CARD BASE === */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .card-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--accent-light);
            font-size: 14px;
        }

        /* === FORM CARD === */
        .form-card {
            animation: fadeUp 0.5s ease 0.15s both;
        }

        .form-body {
            padding: 24px 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 14px;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder { color: var(--text-muted); }

        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-input-prefix {
            position: relative;
        }

        .form-input-prefix .prefix {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .form-input-prefix .form-input {
            padding-left: 26px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* === SUBMIT BUTTON === */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.03em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 24px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(61, 123, 255, 0.3);
        }

        .btn-submit:hover {
            background: #5a92ff;
            transform: translateY(-1px);
            box-shadow: 0 6px 28px rgba(61, 123, 255, 0.45);
        }

        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* === TABLE CARD === */
        .table-card {
            animation: fadeUp 0.5s ease 0.2s both;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 100px;
            letter-spacing: 0.04em;
        }

        .badge-blue {
            background: rgba(61, 123, 255, 0.12);
            color: var(--accent-light);
            border: 1px solid rgba(61, 123, 255, 0.2);
        }

        /* === TABLE === */
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 12px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:last-child { border-bottom: none; }

        tbody tr:hover { background: rgba(61, 123, 255, 0.04); }

        td {
            padding: 14px 20px;
            font-size: 13.5px;
            vertical-align: middle;
        }

        .td-id {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            color: var(--text-muted);
        }

        .td-name { font-weight: 600; color: var(--text-primary); }
        .td-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

        .td-price {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
        }

        .td-stock {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--text-primary);
        }

        /* === STATUS PILLS === */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 11px;
            border-radius: 100px;
        }

        .pill-green { background: var(--green-bg); color: var(--green); border: 1px solid rgba(34, 211, 160, 0.2); }
        .pill-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(240, 180, 41, 0.2); }
        .pill-red { background: var(--red-bg); color: var(--red); border: 1px solid rgba(245, 101, 101, 0.2); }

        /* === EMPTY STATE === */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
        .empty-state p { font-size: 14px; }

        /* === SEARCH BAR === */
        .search-wrap {
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
        }

        .search-inner {
            position: relative;
        }

        .search-inner i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        #search-input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13px;
            padding: 9px 14px 9px 38px;
            outline: none;
            transition: border-color 0.2s;
        }

        #search-input::placeholder { color: var(--text-muted); }
        #search-input:focus { border-color: rgba(61,123,255,0.4); }

        /* === ANIMATIONS === */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === TOAST === */
        #toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: var(--surface);
            border: 1px solid rgba(34, 211, 160, 0.3);
            color: var(--green);
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 9px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            z-index: 999;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }

        #toast.show { opacity: 1; transform: translateY(0); }

        /* === RESPONSIVE === */
        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
            .kpi-row { grid-template-columns: 1fr; }
            .main { padding: 24px 16px; }
            .nav-inner { padding: 0 16px; }
            .nav-time { display: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-inner">
            <div class="nav-brand">
                <div class="nav-logo-icon">
                    <i class="fa-solid fa-briefcase-medical" style="color:#fff"></i>
                </div>
                <div class="nav-title">FARMACIAS <span>SIMI</span></div>
            </div>
            <div class="nav-right">
                <div class="nav-time" id="clock">--:--:--</div>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    Sistema Online
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1>Panel de Inventario</h1>
            <p>Gestión de insumos y productos en tiempo real</p>
        </div>

        <!-- KPI CARDS -->
        <div class="kpi-row" id="kpi-row">
            <div class="kpi-card">
                <div class="kpi-icon blue"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div>
                    <div class="kpi-label">Total Productos</div>
                    <div class="kpi-value" id="kpi-total">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <div class="kpi-label">Stock Óptimo</div>
                    <div class="kpi-value" id="kpi-optimo">—</div>
                </div>
            </div>
            <div class="kpi-card">
                <div class="kpi-icon yellow"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <div>
                    <div class="kpi-label">Stock Bajo / Agotado</div>
                    <div class="kpi-value" id="kpi-alerta">—</div>
                </div>
            </div>
        </div>

        <!-- CONTENT GRID -->
        <div class="content-grid">

            <!-- FORM CARD -->
            <div class="card form-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-plus-circle"></i>
                        Ingresar Insumo
                    </div>
                </div>
                <div class="form-body">
                    <form id="formulario">
                        <div class="form-group">
                            <label class="form-label">Nombre del Producto</label>
                            <input type="text" id="nombre" class="form-input" placeholder="Ej: Amoxicilina 500mg" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Descripción / Categoría</label>
                            <input type="text" id="desc" class="form-input" placeholder="Ej: Antibiótico" required>
                        </div>
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">Precio Unitario</label>
                                <div class="form-input-prefix">
                                    <span class="prefix">$</span>
                                    <input type="number" id="precio" class="form-input" placeholder="0" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Stock Inicial</label>
                                <input type="number" id="stock" class="form-input" placeholder="0" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit" id="btn-guardar">
                            <i class="fa-solid fa-floppy-disk"></i>
                            Guardar Producto
                        </button>
                    </form>
                </div>
            </div>

            <!-- TABLE CARD -->
            <div class="card table-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="fa-solid fa-table-list"></i>
                        Inventario en Tiempo Real
                    </div>
                    <span class="badge badge-blue" id="badge-count">0 items</span>
                </div>
                <div class="search-wrap">
                    <div class="search-inner">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Buscar producto...">
                    </div>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="lista-productos">
                            <!-- rows here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- TOAST -->
    <div id="toast">
        <i class="fa-solid fa-circle-check"></i>
        Producto guardado correctamente
    </div>

    <script>
        // === CLOCK ===
        function actualizarReloj() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('es-CL');
        }
        actualizarReloj();
        setInterval(actualizarReloj, 1000);

        // === CURRENCY ===
        const formatearMoneda = new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' });

        // === TOAST ===
        function showToast(msg = 'Producto guardado correctamente', isError = false) {
            const t = document.getElementById('toast');
            t.innerHTML = `<i class="fa-solid fa-${isError ? 'circle-xmark' : 'circle-check'}"></i> ${msg}`;
            t.style.color = isError ? 'var(--red)' : 'var(--green)';
            t.style.borderColor = isError ? 'rgba(245,101,101,0.3)' : 'rgba(34,211,160,0.3)';
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // === RENDER TABLE ===
        let todosLosProductos = [];

        function renderTabla(productos) {
            const lista = document.getElementById('lista-productos');

            if (productos.length === 0) {
                lista.innerHTML = `
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <i class="fa-solid fa-box-open"></i>
                            <p>No hay productos registrados aún</p>
                        </div>
                    </td></tr>`;
                return;
            }

            lista.innerHTML = productos.map(p => {
                let pill = '';
                if (p.stock > 20) {
                    pill = `<span class="pill pill-green"><i class="fa-solid fa-check"></i>Óptimo</span>`;
                } else if (p.stock > 0) {
                    pill = `<span class="pill pill-yellow"><i class="fa-solid fa-triangle-exclamation"></i>Bajo</span>`;
                } else {
                    pill = `<span class="pill pill-red"><i class="fa-solid fa-xmark"></i>Agotado</span>`;
                }

                return `
                    <tr>
                        <td class="td-id">#${String(p.id).padStart(3, '0')}</td>
                        <td>
                            <div class="td-name">${p.nombre}</div>
                            <div class="td-desc">${p.descripcion}</div>
                        </td>
                        <td class="td-price">${formatearMoneda.format(p.precio)}</td>
                        <td class="td-stock">${p.stock} <span style="color:var(--text-muted);font-size:11px;font-weight:400">un.</span></td>
                        <td>${pill}</td>
                    </tr>`;
            }).join('');
        }

        function actualizarKPIs(productos) {
            const optimo = productos.filter(p => p.stock > 20).length;
            const alerta = productos.filter(p => p.stock <= 20).length;
            document.getElementById('kpi-total').textContent = productos.length;
            document.getElementById('kpi-optimo').textContent = optimo;
            document.getElementById('kpi-alerta').textContent = alerta;
            document.getElementById('badge-count').textContent = `${productos.length} item${productos.length !== 1 ? 's' : ''}`;
        }

        // === SEARCH ===
        document.getElementById('search-input').addEventListener('input', function() {
            const q = this.value.toLowerCase();
            const filtrados = todosLosProductos.filter(p =>
                p.nombre.toLowerCase().includes(q) ||
                p.descripcion.toLowerCase().includes(q)
            );
            renderTabla(filtrados);
        });

        // === CARGAR PRODUCTOS ===
        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                const productos = await res.json();
                todosLosProductos = productos;
                renderTabla(productos);
                actualizarKPIs(productos);
            } catch (error) {
                console.error("Error al cargar los productos:", error);
            }
        }

        // === SUBMIT FORM ===
        document.getElementById('formulario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-guardar');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            const nuevoProducto = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('desc').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value
            };

            try {
                await fetch('/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });
                document.getElementById('formulario').reset();
                await cargarProductos();
                showToast('Producto guardado correctamente');
            } catch (error) {
                console.error("Error al guardar producto:", error);
                showToast('Error al guardar el producto', true);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Producto';
                btn.disabled = false;
            }
        });

        cargarProductos();
    </script>
</body>
</html>
